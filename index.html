<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация на квиз</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Roboto',sans-serif;
    background:#FAC1EA;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:35px;
    border-radius:20px;
    box-shadow:0 12px 30px rgba(0,0,0,.12);
}

h1{
    font-size:32px;
    font-weight:700;
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
    font-size:16px;
    line-height:1.4;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:500;
}

input[type="text"],
input[type="tel"]{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    margin-bottom:22px;
    font-family:'Roboto',sans-serif;
}

.range-wrapper{
    margin-bottom:25px;
}

.people{
    text-align:center;
    font-size:24px;
    font-weight:700;
    color:#d14ea4;
    margin-bottom:18px;
}

input[type="range"]{
    width:100%;
    height:8px;
    cursor:pointer;
    accent-color:#d14ea4;
}

.range-labels{
    display:flex;
    justify-content:space-between;
    margin-top:12px;
    font-size:14px;
    color:#777;
}

.range-labels span{
    text-align:center;
}

.range-labels span::before{
    content:"";
    display:block;
    width:2px;
    height:8px;
    background:#ddd;
    margin:0 auto 5px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#d14ea4;
    color:#fff;
    font-size:17px;
    font-weight:500;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#bc3e92;
}

.success{
    display:none;
    margin-top:25px;
    text-align:center;
    color:#2e7d32;
    font-size:18px;
    font-weight:500;
    line-height:1.5;
}
</style>

</head>

<body>

<div class="container">

<h1>Регистрация на квиз</h1>

<div class="subtitle">
2 июля, 19:00 | Китайка (Октябрьской революции, 205)
</div>


<form id="quizForm" 
action="https://formspree.io/f/xwvgewde" 
method="POST">


<label>Название команды</label>

<input 
type="text" 
name="team"
placeholder="Например: Знатоки"
required>


<label>Количество участников</label>

<div class="range-wrapper">

<div class="people">
<span id="count">3</span> человека
</div>

<input 
type="range"
id="members"
name="members"
min="3"
max="8"
value="3"
step="1"
>


<div class="range-labels">
<span>3</span>
<span>4</span>
<span>5</span>
<span>6</span>
<span>7</span>
<span>8</span>
</div>

</div>


<label>Контактный телефон</label>

<input 
type="tel"
name="phone"
placeholder="+7 (___) ___-__-__"
required>


<button type="submit">
Зарегистрироваться
</button>


</form>


<div class="success" id="success">

Спасибо за регистрацию!<br>
С вами свяжутся за день до квиза.

</div>


</div>


<script>

const range = document.getElementById("members");
const count = document.getElementById("count");

range.addEventListener("input", function(){
    count.textContent = this.value;
});


const form = document.getElementById("quizForm");

form.addEventListener("submit", async function(e){

    e.preventDefault();

    const data = new FormData(form);

    const response = await fetch(form.action, {
        method: "POST",
        body: data,
        headers: {
            "Accept": "application/json"
        }
    });


    if(response.ok){

        form.style.display="none";

        document.getElementById("success").style.display="block";

    } else {

        alert("Ошибка отправки. Попробуйте ещё раз.");

    }

});

</script>


</body>
</html>
